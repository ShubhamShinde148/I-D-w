<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: rgb(221, 228, 227);
      width: 480px;
      height: 125px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .line1 {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-weight: 700;
      font-size: 38px;
      color: #1b3274;
      line-height: 1.35;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    .line2 {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-weight: 700;
      font-size: 37px;
      color: #1b3274;
      line-height: 1.35;
      letter-spacing: -0.4px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="line1">गट विकास अधिकारी (उ.श्रे.)</div>
  <div class="line2">पंचायत समिती आंबेगाव (पुणे)</div>
</body>
</html>
